<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>
    :root {
      --swi-toolbar-h: 46px;
    }
    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--swi-bg);
    }
    body.swi-gigasector-page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      margin: 0;
      color: var(--swi-fg);
    }
    #app {
      width: 100%;
      height: calc(100svh - var(--swi-toolbar-h) - env(safe-area-inset-top));
      height: calc(100dvh - var(--swi-toolbar-h) - env(safe-area-inset-top));
      min-height: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }
    @media (max-width: 640px) {
      #app .bg-dark.px-3.py-2 {
        padding-top: 0.45rem;
        padding-bottom: 0.45rem;
      }
      #app .bg-dark.px-3.py-2 h1 {
        font-size: 1.05rem;
        line-height: 1.25rem;
      }
      #app .waveform-section {
        height: clamp(86px, 18svh, 124px);
        min-height: 82px;
      }
      #app .p-4 {
        padding: 0.72rem;
      }
      #app .py-4 {
        padding-top: 0.65rem;
        padding-bottom: 0.65rem;
      }
      #app .mb-4 {
        margin-bottom: 0.65rem;
      }
      #app .text-2xl {
        font-size: 1.16rem;
        line-height: 1.35rem;
      }
      #app #markers-container {
        min-height: 0;
        overflow-y: auto;
      }
      #app #player-container > div,
      #app #upload-container > div,
      #app #setlist-container > div {
        min-height: 0;
      }
    }
    @media (max-height: 720px) {
      #app .waveform-section {
        height: 82px;
        min-height: 78px;
      }
      #app .min-h-\[160px\] {
        min-height: 118px;
      }
      #app .text-6xl {
        font-size: 2.6rem;
        line-height: 1;
      }
    }
    html[data-theme="light"] #app .bg-dark,
    html[data-theme="light"] #app .bg-darker,
    html[data-theme="light"] #app .bg-black,
    html[data-theme="light"] #app .bg-gray-800,
    html[data-theme="light"] #app .bg-gray-700 {
      background-color: var(--swi-panel) !important;
    }
    html[data-theme="light"] #app .border-gray-800,
    html[data-theme="light"] #app .border-gray-700,
    html[data-theme="light"] #app .divide-gray-800 > :not([hidden]) ~ :not([hidden]) {
      border-color: var(--swi-border) !important;
    }
    html[data-theme="light"] #app .text-white,
    html[data-theme="light"] #app .text-gray-300 {
      color: var(--swi-fg) !important;
    }
    html[data-theme="light"] #app .text-gray-400,
    html[data-theme="light"] #app .text-gray-500 {
      color: var(--swi-muted) !important;
    }
    #app button:not(:disabled) {
      border: 1px solid color-mix(in srgb, var(--swi-accent) 72%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--swi-accent) 12%, transparent);
    }
    #app button:not(:disabled):not(.bg-accent):not(.bg-red-600) {
      background-color: color-mix(in srgb, var(--swi-accent) 22%, var(--swi-panel)) !important;
      color: var(--swi-fg);
    }
    #app button:not(:disabled):hover,
    #app button:not(:disabled):focus-visible {
      border-color: var(--swi-accent);
      background-color: color-mix(in srgb, var(--swi-accent) 34%, var(--swi-panel)) !important;
    }
    #app button.bg-accent:not(:disabled),
    #app button.bg-red-600:not(:disabled) {
      border-color: color-mix(in srgb, #fff 28%, var(--swi-accent));
      box-shadow: 0 2px 10px color-mix(in srgb, var(--swi-accent) 28%, transparent);
    }
    #app .delete-btn:not(:disabled) {
      color: #ff6670 !important;
      background-color: color-mix(in srgb, var(--swi-accent) 14%, var(--swi-panel)) !important;
    }
    #app #confirm-delete:not(:disabled) {
      background-color: #b91c1c !important;
      border-color: #fca5a5;
    }
    #app button:focus-visible,
    .swi-tool-action:focus-visible {
      outline: 2px solid var(--swi-accent);
      outline-offset: 2px;
    }
    #app button:disabled {
      opacity: 0.34;
      cursor: not-allowed;
    }
    #app .move-song-btn {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      border-radius: 8px;
      color: var(--swi-accent);
      font-weight: 900;
      line-height: 1;
    }
    #app .song-select-area {
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #app .marker-set-btn,
    #app .loop-toggle-btn,
    #app #bpm-down,
    #app #bpm-up,
    #app #detect-bpm-btn,
    #app #reset-markers-btn {
      min-width: 44px;
      min-height: 44px;
    }
    @media (max-width: 430px) {
      #app .song-item > .flex {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }
      #app .setlist-item-actions {
        gap: 2px;
        margin-left: 0.35rem;
      }
      #app .delete-btn,
      #app .move-song-btn {
        width: 44px;
        min-width: 44px;
      }
      #app .song-select-area > .mt-1 {
        flex-wrap: wrap;
        column-gap: 0.4rem;
        row-gap: 0.15rem;
      }
    }
    .swi-tool-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .swi-tool-action {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--swi-accent);
      font: 800 1rem/1 var(--swi-font);
      cursor: pointer;
    }
    .swi-tool-action:hover,
    .swi-tool-action:focus-visible {
      color: var(--swi-accent);
      background: rgba(255, 255, 255, 0.07);
    }
    .swi-help-modal {
      position: fixed;
      inset: 0;
      z-index: 700;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.74);
    }
    .swi-help-modal[hidden] { display: none; }
    .swi-help-card {
      width: min(360px, 100%);
      padding: 20px;
      border: 1px solid var(--swi-border-strong);
      border-radius: 12px;
      background: var(--swi-panel);
      color: var(--swi-fg);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      font-family: var(--swi-font);
    }
    .swi-help-card h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .swi-help-card p { margin: 0 0 10px; color: var(--swi-muted); font-size: 0.86rem; line-height: 1.45; }
    .swi-help-card ol { margin: 0 0 16px; padding-left: 20px; color: var(--swi-muted); font-size: 0.86rem; line-height: 1.5; list-style: decimal; }
    .swi-help-card button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--swi-accent);
      color: #fff;
      font: 800 0.9rem/1 var(--swi-font);
      cursor: pointer;
    }
  </style>

<body class="swi-gigasector-page">
  <header class="swi-tool-backbar">
    <a class="swi-tool-back" href="/apps/">← Apps</a>
    <strong class="swi-tool-title">Gigasector</strong>
    <div class="swi-tool-actions">
      <button class="swi-tool-action" id="helpBtn" type="button" title="How to use Gigasector" aria-label="How to use Gigasector">?</button>
      <button class="swi-tool-action" id="shareBtn" type="button" title="Share Gigasector" aria-label="Share Gigasector">↗</button>
      <label class="swi-theme-switch">
        <input id="toolThemeSwitch" type="checkbox" role="switch" aria-label="Switch to light mode">
        <i aria-hidden="true"></i>
        <span class="swi-theme-label">Theme</span>
      </label>
    </div>
  </header>
  <div id="app"></div>
  <div class="swi-help-modal" id="helpModal" hidden>
    <section class="swi-help-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle">Using Gigasector</h2>
      <p>Build a rehearsal setlist with track-specific section markers.</p>
      <ol>
        <li>Upload an audio track, then open it in Player.</li>
        <li>Set A/B for the intro and C/D for the outro at the playhead.</li>
        <li>Use the Setlist arrows to arrange tracks in performance order.</li>
      </ol>
      <button id="helpClose" type="button">Got it</button>
    </section>
  </div>
  <script>
    (() => {
      const themeSwitch = document.getElementById('toolThemeSwitch');
      const helpModal = document.getElementById('helpModal');
      const syncTheme = () => {
        const theme = document.documentElement.dataset.theme || 'dark';
        themeSwitch.checked = theme === 'light';
        themeSwitch.setAttribute('aria-label', `Switch to ${theme === 'light' ? 'dark' : 'light'} mode`);
      };
      themeSwitch.addEventListener('change', () => {
        const theme = themeSwitch.checked ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem('swi-theme', theme); } catch {}
        window.dispatchEvent(new CustomEvent('swi-theme-change', { detail: { theme } }));
        syncTheme();
      });
      window.addEventListener('swi-theme-change', syncTheme);
      document.addEventListener('DOMContentLoaded', syncTheme, { once: true });

      document.getElementById('shareBtn').addEventListener('click', async () => {
        const data = { title: document.title, url: window.location.href };
        try {
          if (navigator.share) await navigator.share(data);
          else {
            await navigator.clipboard.writeText(data.url);
            document.getElementById('shareBtn').title = 'Link copied';
          }
        } catch (error) {
          if (error.name !== 'AbortError') console.warn('Unable to share', error);
        }
      });
      const closeHelp = () => { helpModal.hidden = true; };
      document.getElementById('helpBtn').addEventListener('click', () => {
        helpModal.hidden = false;
        document.getElementById('helpClose').focus();
      });
      document.getElementById('helpClose').addEventListener('click', closeHelp);
      helpModal.addEventListener('click', event => {
        if (event.target === helpModal) closeHelp();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeHelp();
      });
    })();
  </script>
</body>
